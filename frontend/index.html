<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JustHireMeAlready</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Mis candidaturas</h1>

        <!-- Barra de estadísticas: el JS la rellena -->
        <div id="stats"></div>

        <!-- FORMULARIO para añadir una candidatura nueva. -->
        <h2>Añadir candidatura</h2>
        <form id="form-candidatura">
            <label>Estado:
                <select id="estado">
                    <option value="enviada">Enviada</option>
                    <option value="contactado">Contactado</option>
                    <option value="entrevista">Entrevista</option>
                    <option value="oferta">Oferta</option>
                    <option value="rechazada">Rechazada</option>
                    <option value="pendiente">Pendiente</option>
                </select>
            </label>

            <label>Fecha:
                <input type="date" id="fecha_peticion">
            </label>

            <label>Empresa:
                <input type="text" id="empresa" placeholder="Ej: Indra">
            </label>

            <label>Puesto:
                <input type="text" id="puesto" placeholder="Ej: SOC Analyst">
            </label>

            <label>Link:
                <input type="url" id="link_oferta" placeholder="https://...">
            </label>

            <label>Portal:
                <input type="text" id="portal" placeholder="Ej: LinkedIn">
            </label>

            <label>Ubicación:
                <input type="text" id="ubicacion" placeholder="Ej: A Coruña">
            </label>

            <label>Modalidad:
                <input type="text" id="modalidad" placeholder="Ej: Remoto">
            </label>

            <button type="button" id="btn-anadir">Añadir</button>
        </form>

        <!-- ZONA DE LISTADO -->
        <h2>Listado</h2>
        <table>
            <thead>
                <tr>
                    <th>Empresa</th>
                    <th>Puesto</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th>Ubicación</th>
                    <th>Modalidad</th>
                    <th>Portal</th>
                    <th>Link</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-candidaturas">
                <!-- filas generadas por JS -->
            </tbody>
        </table>
    </div>

    <script src="static/js/main.js" defer></script>
</body>
</html>
